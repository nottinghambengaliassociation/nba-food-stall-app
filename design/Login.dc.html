<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1917}a:hover{color:#B5050F}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; box-sizing: border-box; background: #F5F5F4; color: #1C1917; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 40px 16px">

<main style="width: 100%; max-width: 520px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; padding: 40px 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: 0 1px 2px rgba(28,25,23,0.06), 0 12px 32px rgba(28,25,23,0.08)">
<img src="/_blob/8596d0ba442a189b04f424ac7cbd051b" alt="Nottingham Bengali Association logo" style="width: 168px; height: 168px; object-fit: contain">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 38px">Nottingham Bengali Association</h1>
<p style="margin: 0; font-size: 20px; line-height: 26px; color: #B5050F; font-weight: 700">Food Stall Application</p>
</div>

<sc-if value="{{signedOut}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" style="width: 100%; display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 14px 16px; border-radius: 12px; background: #FEE2E2; color: #7F1D1D; font-size: 17px; line-height: 24px"><b>Username or password is wrong.</b> Check and try again.</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="user" style="font-size: 17px; font-weight: 700">Username</label>
<input id="user" value="{{user}}" onChange="{{onUser}}" autocomplete="username" autocapitalize="none" spellcheck="false" style="height: 60px; box-sizing: border-box; padding: 0 18px; font-size: 22px; border: 2px solid {{fieldBorder}}; border-radius: 14px; color: #1C1917; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pass" style="font-size: 17px; font-weight: 700">Password</label>
<div style="position: relative">
<input id="pass" type="{{passType}}" value="{{pass}}" onChange="{{onPass}}" autocomplete="current-password" style="width: 100%; height: 60px; box-sizing: border-box; padding: 0 96px 0 18px; font-size: 22px; border: 2px solid {{fieldBorder}}; border-radius: 14px; color: #1C1917; background: #FFFFFF">
<button type="button" onClick="{{toggleShow}}" aria-pressed="{{showing}}" style="position: absolute; right: 6px; top: 6px; height: 48px; padding: 0 14px; border: none; border-radius: 10px; background: #F5F5F4; color: #1C1917; font-size: 16px; font-weight: 700">{{showLabel}}</button>
</div>
</div>
<button type="submit" style="height: 68px; border: none; border-radius: 16px; background: #B5050F; color: #FFFFFF; font-size: 22px; font-weight: 700">Sign in</button>
</form>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #57534E; text-align: center">One shared login for stall volunteers. Ask the stall lead if you don't have it.</p>
</sc-if>

<sc-if value="{{signedIn}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; display: flex; flex-direction: column; gap: 14px">
<p role="status" style="margin: 0; text-align: center; font-size: 19px; font-weight: 700; color: #134E4A">Signed in. Where are you working?</p>
<a href="CashCounter.dc.html" style="display: flex; align-items: center; justify-content: center; height: 68px; border-radius: 16px; background: #0F766E; color: #FFFFFF; font-size: 22px; font-weight: 700; text-decoration: none">Cash counter</a>
<a href="FoodCounter.dc.html" style="display: flex; align-items: center; justify-content: center; height: 68px; border-radius: 16px; background: #1D4ED8; color: #FFFFFF; font-size: 22px; font-weight: 700; text-decoration: none">Food counter</a>
<a href="Reports.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; border: 2px solid #1C1917; color: #1C1917; font-size: 20px; font-weight: 700; text-decoration: none">Reports</a>
<button type="button" onClick="{{signOut}}" style="align-self: center; height: 44px; padding: 0 16px; border: none; background: transparent; color: #57534E; font-size: 16px; text-decoration: underline">Sign out</button>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { user: '', pass: '', show: false, error: false, signedIn: false };
  }
  renderVals() {
    const s = this.state;
    return {
      user: s.user, pass: s.pass,
      onUser: (e) => this.setState({ user: e.target.value, error: false }),
      onPass: (e) => this.setState({ pass: e.target.value, error: false }),
      passType: s.show ? 'text' : 'password',
      showing: s.show, showLabel: s.show ? 'Hide' : 'Show',
      toggleShow: () => this.setState({ show: !this.state.show }),
      hasError: s.error,
      fieldBorder: s.error ? '#B91C1C' : '#A8A29E',
      signedOut: !s.signedIn, signedIn: s.signedIn,
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ok = this.state.user.trim().toLowerCase() === '[USER]' && this.state.pass === '[PASSWORD]' /* mock-up only: the real app compares SHA-256 against public/js/login-config.js */;
        if (ok) this.setState({ signedIn: true, error: false, pass: '' });
        else this.setState({ error: true, pass: '' });
      },
      signOut: () => this.setState({ signedIn: false, user: '', pass: '', show: false })
    };
  }
}
</script>
</body>
</html>
