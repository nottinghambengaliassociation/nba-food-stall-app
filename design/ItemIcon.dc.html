<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu item icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; color: #1C1917; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isFuchka}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="28" r="14"></circle><path d="M16 23c4-3.5 12-3.5 16 0"></path><path d="M24 5v6M17 8l2.5 4.5M31 8l-2.5 4.5"></path></svg>
</sc-if>
<sc-if value="{{isMomo}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 34c0-11 7-20 16-20s16 9 16 20z"></path><path d="M5 34h38"></path><path d="M24 14v7M18 16.5l3 5M30 16.5l-3 5"></path></svg>
</sc-if>
<sc-if value="{{isChat}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 23h38c0 10-8.5 18-19 18S5 33 5 23z"></path><circle cx="15" cy="17" r="3.5"></circle><circle cx="25" cy="14" r="3.5"></circle><circle cx="34" cy="17.5" r="3"></circle></svg>
</sc-if>
<sc-if value="{{isSamosa}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 7L42 37H6z"></path><path d="M15 29h18"></path><path d="M24 7v22"></path></svg>
</sc-if>
<sc-if value="{{isStraw}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 43c-9-5-14.5-13-12.5-22 3-4.5 22-4.5 25 0 2 9-3.5 17-12.5 22z"></path><path d="M17 15l7 4 7-4M24 19V7"></path><path d="M19 27v.5M29 27v.5M24 33v.5"></path></svg>
</sc-if>
<sc-if value="{{isFountain}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6v32"></path><path d="M15 15h18"></path><path d="M10 26h28"></path><path d="M7 40h34"></path><path d="M15 15v4M33 15v4M10 26v5M38 26v5"></path></svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["fuchka","momo","chat","samosa","straw","fountain"],"default":"fuchka"},"size":{"editor":"int","default":96,"min":16,"max":200},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'fuchka';
    const s = this.props.size ?? 96;
    return {
      px: s + 'px',
      isFuchka: k === 'fuchka', isMomo: k === 'momo', isChat: k === 'chat',
      isSamosa: k === 'samosa', isStraw: k === 'straw', isFountain: k === 'fountain'
    };
  }
}
</script>
</body>
</html>
