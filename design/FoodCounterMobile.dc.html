<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food counter, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FDE68A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F4; color: #1C1917; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; height: 60px; flex: none; padding: 0 16px; background: #1C1917; color: #FFFFFF">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Food counter</span>
<span style="display: flex; align-items: center; gap: 10px">
<button onClick="{{undo}}" disabled="{{noUndo}}" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid #A8A29E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 700">Undo</button>
<a href="LoginMobile.dc.html" aria-label="Sign out" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 2px solid #78716C; border-radius: 10px; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></a>
</span>
</header>

<div role="tablist" aria-label="Order status" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E7E5E4">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 60px; border-radius: 12px; border: 3px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
<span style="font-size: 22px; font-weight: 800; line-height: 24px">{{t.count}}</span>
<span style="font-size: 14px; font-weight: 700">{{t.label}}</span>
</button>
</sc-for>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 20px">
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 0; text-align: center; font-size: 18px; color: #57534E">Nothing here right now</div>
</sc-if>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<article style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(28,25,23,0.08)">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{o.no}}</span>
<span style="font-size: 22px; font-weight: 700">{{o.name}}</span>
<span style="font-size: 15px; font-weight: 700; color: {{o.ageColour}}">{{o.age}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{o.lines}}" as="l" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; font-size: 19px; line-height: 24px"><dc-import name="ItemIcon" kind="{{l.id}}" size="{{ 26 }}" hint-size="26px,26px"></dc-import><b style="width: 30px">{{l.qty}}×</b><span>{{l.name}}</span></div>
</sc-for>
</div>
<button onClick="{{o.next}}" style="height: 60px; border: none; border-radius: 12px; background: {{o.actionBg}}; color: #FFFFFF; font-size: 21px; font-weight: 700">{{o.actionLabel}}</button>
</article>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'new',
      last: null,
      orders: [
        { no: 'A-041', name: 'Ahmed', status: 'preparing', mins: 5, items: { momo: 2, chat: 1 } },
        { no: 'A-042', name: 'Sam', status: 'ready', mins: 4, items: { fuchka: 1, straw: 1 } },
        { no: 'B-012', name: 'Meera', status: 'new', mins: 2, items: { fountain: 1 } },
        { no: 'A-043', name: 'Priya', status: 'new', mins: 1, items: { fuchka: 2, momo: 1 } },
        { no: 'A-044', name: 'Josh', status: 'new', mins: 0, items: { chat: 1, straw: 2 } }
      ]
    };
  }
  renderVals() {
    const NAMES = { fuchka: 'Fuchka', momo: 'Momo', chat: 'Papri Chat', samosa: 'Sweets Box', straw: 'Choc Strawberry', fountain: 'Choc Fountain' };
    const NEXT = { new: 'preparing', preparing: 'ready', ready: 'collected' };
    const TABS = [
      { key: 'new', label: 'New', bg: '#FDE68A', fg: '#1C1917', action: 'Start', actionBg: '#1D4ED8' },
      { key: 'preparing', label: 'Preparing', bg: '#BFDBFE', fg: '#1C1917', action: 'Ready', actionBg: '#0F766E' },
      { key: 'ready', label: 'Ready', bg: '#0F766E', fg: '#FFFFFF', action: 'Collected', actionBg: '#1C1917' }
    ];
    const s = this.state;
    const cur = TABS.find((t) => t.key === s.tab);
    const advance = (no) => {
      const o = this.state.orders.find((x) => x.no === no);
      this.setState({
        orders: this.state.orders.map((x) => x.no === no ? Object.assign({}, x, { status: NEXT[o.status] }) : x),
        last: { no: no, prev: o.status }
      });
    };
    const list = s.orders.filter((o) => o.status === s.tab).sort((a, b) => b.mins - a.mins).map((o) => ({
      no: o.no, name: s.tab === 'ready' ? o.name.toUpperCase() : o.name,
      age: o.mins === 0 ? 'just now' : o.mins + ' min',
      ageColour: o.mins >= 6 ? '#B45309' : '#57534E',
      lines: Object.keys(o.items).map((id) => ({ id: id, qty: o.items[id], name: NAMES[id] })),
      actionLabel: cur.action, actionBg: cur.actionBg,
      next: () => advance(o.no)
    }));
    return {
      tabs: TABS.map((t) => ({
        label: t.label, on: t.key === s.tab,
        count: s.orders.filter((o) => o.status === t.key).length,
        bg: t.key === s.tab ? t.bg : '#FFFFFF',
        fg: t.key === s.tab ? t.fg : '#1C1917',
        border: t.key === s.tab ? '#1C1917' : '#D6D3D1',
        pick: () => this.setState({ tab: t.key })
      })),
      orders: list, isEmpty: list.length === 0,
      actionLabel: cur.action, actionBg: cur.actionBg,
      noUndo: !s.last,
      undo: () => {
        const l = this.state.last;
        if (!l) return;
        this.setState({
          orders: this.state.orders.map((x) => x.no === l.no ? Object.assign({}, x, { status: l.prev }) : x),
          last: null
        });
      }
    };
  }
}
</script>
</body>
</html>
