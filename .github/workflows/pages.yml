name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Writes the gitignored public/js/firebase-config.js from repository
      # secrets. The script prints only "written" or "missing: <NAMES>" — it
      # never echoes a value. If a secret is absent it writes the PASTE_
      # placeholder file, so the app shows its "Storage not configured"
      # banner instead of crashing, and the deploy still goes ahead.
      - name: Write Firebase web config from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: node scripts/write-firebase-config.mjs --from-env

      # Writes the gitignored public/js/login-config.js from repository
      # secrets. Only the SHA-256 hash of the password is ever stored or
      # passed here — never the plain password. Same contract as above: the
      # script prints only "written" or "missing: <NAMES>", and writes the
      # PASTE_ placeholder file if a secret is absent, so the app shows
      # "Login not configured" instead of failing the deploy.
      - name: Write login config from secrets
        env:
          APP_LOGIN_USER: ${{ secrets.APP_LOGIN_USER }}
          APP_LOGIN_PASSWORD_SHA256: ${{ secrets.APP_LOGIN_PASSWORD_SHA256 }}
        run: node scripts/write-login-config.mjs --from-env

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
